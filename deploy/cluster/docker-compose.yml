services:
  mysql-a:
      container_name: mysql-a
      hostname: mysql-a
      image: mysql:8.4
      env_file:
        - ./docker-compose.env
      ports:
        - "3306:3306"
      volumes:
        - ./initdb.d/setup.sql:/docker-entrypoint-initdb.d/setup.sql
        - ./conf/my.cnf.a:/etc/mysql/my.cnf
        - ./data-mysql-a:/var/lib/mysql
      networks:
        - mysql-cluster
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 10s
        timeout: 5s
        retries: 3
      deploy:
        resources:
          limits:
            cpus: "0.5"
            memory: "512M"

  mysql-b:
      container_name: mysql-b
      hostname: mysql-b
      image: mysql:8.4
      env_file:
        - ./docker-compose.env
      ports:
        - "3307:3306"
      volumes:
        - ./initdb.d/setup.sql:/docker-entrypoint-initdb.d/setup.sql
        - ./conf/my.cnf.b:/etc/mysql/my.cnf
        - ./data-mysql-b:/var/lib/mysql
      networks:
        - mysql-cluster
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 10s
        timeout: 5s
        retries: 3
      deploy:
        resources:
          limits:
            cpus: "0.5"
            memory: "512M"

  mysql-c:
      container_name: mysql-c
      hostname: mysql-c
      image: mysql:8.4
      env_file:
        - ./docker-compose.env
      ports:
        - "3308:3306"
      volumes:
        - ./initdb.d/setup.sql:/docker-entrypoint-initdb.d/setup.sql
        - ./conf/my.cnf.c:/etc/mysql/my.cnf
        - ./data-mysql-c:/var/lib/mysql
      networks:
        - mysql-cluster
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 10s
        timeout: 5s
        retries: 3
      deploy:
        resources:
          limits:
            cpus: "0.5"
            memory: "512M"

