defaults
  timeout client  28800s
  timeout connect 10s
  timeout server  28800s
  option  tcplog

frontend myfrontend
  bind 0.0.0.0:7777
  default_backend myservers

backend myservers
  balance source
  stick-table type ip size 200k expire 30m
  stick on src
    
  server r0 172.18.0.5:6446 check inter 2s fall 3 rise 2
  server r1 172.18.0.6:16446 check port 16446 inter 2s fall 3 rise 2
